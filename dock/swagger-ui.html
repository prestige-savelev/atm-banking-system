<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ATM Banking System API - Swagger UI</title>
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar { display: none; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      const spec = `openapi: 3.0.3
info:
  title: ATM Banking System API
  description: |
    Backend banking system (Node.js + TypeScript + Express + PostgreSQL).
    
    ### Основные возможности
    - Регистрация и вход (JWT в httpOnly cookie \`accessToken\`)
    - Банковский счёт (один на пользователя)
    - Карты (до 5 штук, PIN 4 цифры)
    - Переводы между картами
    - Операции через банкомат (deposit / withdraw / история)
    - Балансы и история транзакций
    
    ### Аутентификация
    - Обычные эндпоинты: cookie \`accessToken\`
    - Банкомат: \`card_id\` + \`pin\` + \`bankomat_id\` + \`password\` (без JWT)
    
    ### Формат ответов
    - Успех: \`{ "message": "...", "data": ... }\`
    - Ошибка: \`{ "message": "..." }\`
    
    ### Особенности реализации
    - Деньги хранятся на картах (\`cash\`), баланс счёта = SUM(cash)
    - Один счёт на пользователя
    - PIN хешируется bcrypt
    - Некоторые GET принимают body (нестандартно)
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Local

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken

  schemas:
    SuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: Операция выполнена успешно
        data:
          type: object
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Пользователь не найден
    UserCreate:
      type: object
      required: [first_name, last_name, email, gender, age, bio, password]
      properties:
        first_name: { type: string, example: Иван }
        last_name: { type: string, example: Иванов }
        email: { type: string, format: email, example: ivan@example.com }
        gender: { type: string, example: male }
        age: { type: integer, example: 25 }
        bio: { type: string, example: Программист }
        password: { type: string, example: StrongPass123 }
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: ivan@example.com }
        password: { type: string, example: StrongPass123 }
    PinRequest:
      type: object
      required: [pin]
      properties:
        pin: { type: string, pattern: '^[0-9]{4}$', example: "1234" }
    CardIdPin:
      type: object
      required: [card_id, pin]
      properties:
        card_id: { type: integer, example: 1 }
        pin: { type: string, example: "1234" }
    TransferRequest:
      type: object
      required: [sender_card_number, receiver_card_number, pin, cash]
      properties:
        sender_card_number: { type: string, example: "4111111111111111" }
        receiver_card_number: { type: string, example: "4222222222222222" }
        pin: { type: string, example: "1234" }
        cash: { type: number, example: 1000.50 }
    BankomatAuth:
      type: object
      required: [card_id, pin, bankomat_id, password]
      properties:
        card_id: { type: integer, example: 1 }
        pin: { type: string, example: "1234" }
        bankomat_id: { type: integer, example: 1 }
        password: { type: string, example: "atm_secret" }
    BankomatOperation:
      type: object
      required: [card_id, bankomat_id, pin, password, cash]
      properties:
        card_id: { type: integer, example: 1 }
        bankomat_id: { type: integer, example: 1 }
        pin: { type: string, example: "1234" }
        password: { type: string, example: "atm_secret" }
        cash: { type: number, example: 5000 }

security:
  - cookieAuth: []

paths:
  /user/auth:
    post:
      tags: [Auth]
      summary: Вход в систему
      description: Проверяет email + password. При успехе ставит cookie \`accessToken\`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            examples:
              success:
                value:
                  email: ivan@example.com
                  password: StrongPass123
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: Успешная аутентификация
                data:
                  id: 1
                  first_name: Иван
                  last_name: Иванов
                  email: ivan@example.com
        '401':
          description: Неверный пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    post:
      tags: [Users]
      summary: Регистрация пользователя
      description: Создаёт пользователя, хеширует пароль, ставит cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            example:
              first_name: Иван
              last_name: Иванов
              email: ivan@example.com
              gender: male
              age: 25
              bio: Тестовый пользователь
              password: StrongPass123
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

    get:
      tags: [Users]
      summary: Список всех пользователей
      security: []
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /users/me:
    get:
      tags: [Users]
      summary: Текущий пользователь
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: Пользователь успешно получен
                data:
                  id: 1
                  first_name: Иван
                  last_name: Иванов
                  age: 25
                  bio: Тестовый пользователь

  /users/{id}:
    get:
      tags: [Users]
      summary: Пользователь по ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/delete:
    post:
      tags: [Users]
      summary: Удалить текущего пользователя
      description: Удаляет пользователя, его счёт и все карты.
      responses:
        '200':
          description: Удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /bank_account/create:
    post:
      tags: [Bank Account]
      summary: Создать счёт + первую карту
      description: Один счёт на пользователя. Генерирует номер счёта и карты.
      responses:
        '200':
          description: Создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: Банковский счет и карта успешно созданы
                data:
                  bankAccount:
                    id: 1
                    account_number: "40817810099910004312"
                  card:
                    id: 1
                    card_number: "4111111111111111"
                    card_name: Иван Иванов
        '409':
          description: Счёт уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bank_account:
    get:
      tags: [Bank Account]
      summary: Получить номер счёта
      responses:
        '200':
          description: Номер счёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /bank_account/balance:
    get:
      tags: [Bank Account]
      summary: Баланс счёта
      description: Сумма cash по всем картам счёта.
      responses:
        '200':
          description: Баланс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: Баланс банковского счёта успешно получен
                data:
                  account_number: "40817810099910004312"
                  balance: "15000.00"

  /bank_account/delete:
    post:
      tags: [Bank Account]
      summary: Удалить счёт и карты
      responses:
        '200':
          description: Удалено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /card:
    get:
      tags: [Cards]
      summary: Список карт пользователя
      responses:
        '200':
          description: Карты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: Карта успешно получена
                data:
                  - id: 1
                    card_number: "4111111111111111"
                    card_name: Иван Иванов
                    cash: "10000.00"
                    is_active: true

  /card/add:
    post:
      tags: [Cards]
      summary: Добавить карту
      description: Максимум 5 карт. Если передать pin — карта сразу активируется.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pin:
                  type: string
                  example: "1234"
            example:
              pin: "1234"
      responses:
        '200':
          description: Карта создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Лимит 5 карт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /card/pin:
    post:
      tags: [Cards]
      summary: Установить / изменить PIN и активировать карту
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardIdPin'
            example:
              card_id: 1
              pin: "1234"
      responses:
        '200':
          description: PIN изменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /card/balance/{id}:
    get:
      tags: [Cards]
      summary: Баланс конкретной карты
      description: Требует PIN в body (GET с телом).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
            example:
              pin: "1234"
      responses:
        '200':
          description: Баланс карты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: Балас успешно получен
                data:
                  balance: "10000.00"
        '402':
          description: Карта не активна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Неверный PIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /card/delete/{id}:
    post:
      tags: [Cards]
      summary: Удалить карту
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
            example:
              pin: "1234"
      responses:
        '200':
          description: Удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /card/activation/{id}:
    post:
      tags: [Cards]
      summary: Активировать карту
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
            example:
              pin: "1234"
      responses:
        '200':
          description: Активирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /card/deactivation/{id}:
    post:
      tags: [Cards]
      summary: Деактивировать карту
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PinRequest'
            example:
              pin: "1234"
      responses:
        '200':
          description: Деактивирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /transaction/transfer:
    post:
      tags: [Transactions]
      summary: Перевод между картами
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            example:
              sender_card_number: "4111111111111111"
              receiver_card_number: "4222222222222222"
              pin: "1234"
              cash: 1500
      responses:
        '200':
          description: Перевод выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /transaction:
    get:
      tags: [Transactions]
      summary: История переводов по картам
      responses:
        '200':
          description: История
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                message: История транзакций успешно получена
                data:
                  transactions:
                    - id: 1
                      sender_card_number: "4111111111111111"
                      receiver_card_number: "4222222222222222"
                      cash: "1500.00"
                      created_at: "2026-11-18T18:00:00Z"

  /bankomat_transaction:
    get:
      tags: [ATM]
      summary: История операций в банкомате
      description: Авторизация через PIN карты + пароль банкомата. Body на GET.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankomatAuth'
            example:
              card_id: 1
              pin: "1234"
              bankomat_id: 1
              password: "atm_secret"
      responses:
        '200':
          description: История
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /bankomat_transaction/deposit:
    post:
      tags: [ATM]
      summary: Пополнение через банкомат
      description: Списывает наличные с банкомата, зачисляет на карту.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankomatOperation'
            example:
              card_id: 1
              bankomat_id: 1
              pin: "1234"
              password: "atm_secret"
              cash: 5000
      responses:
        '200':
          description: Пополнение выполнено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Недостаточно наличных в банкомате / неверная сумма
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Превышен лимит банкомата
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bankomat_transaction/withdraw:
    post:
      tags: [ATM]
      summary: Снятие наличных через банкомат
      description: Списывает с карты, добавляет наличные в банкомат.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankomatOperation'
            example:
              card_id: 1
              bankomat_id: 1
              pin: "1234"
              password: "atm_secret"
              cash: 2000
      responses:
        '200':
          description: Снятие выполнено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Недостаточно средств на карте / неверная сумма
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
`;

      const ui = SwaggerUIBundle({
        spec: jsyaml.load(spec),
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        defaultModelsExpandDepth: 1,
        docExpansion: "list",
        filter: true,
        tryItOutEnabled: true
      });
      window.ui = ui;
    };
  </script>
  <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</body>
</html>
